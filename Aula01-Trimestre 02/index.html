<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Formulário HTML</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Cadastro do usuário</h1>
        <form action="cadastro.php" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">
            <br>
            <label for="email">E-mail:</label>
            <input type="email" id="e-mail" name="email">
            <br>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha">
            <br>
            <label for="idade">idade:</label>
            <input type="number" id="idade" name="idade">
            <br>
            <label for="data">Data de nascimento:</label>
            <input type="date" id="data">
            <br>
            <p>Turno:</p>
            <input type="radio" name="manha" id="manha"> <label for="manha">Manhã</label>
            <input type="radio" name="tarde" id="tarde"> <label for="tarde">tarde</label>
            <input type="radio" name="noite" id="noite"> <label for="manha">noite</label>
            <br>
            <p>Áreas de interesse:</p>
            <input type="checkbox" name="programacao" id="programacao"> <label for="programacao">Programação</label>
            <input type="checkbox" name="design" id="design"> <label for="design">Design</label>
            <input type="checkbox" name="redes" id="redes"> <label for="redes">Redes</label>
            <br>
            <input type="submit" value="enviar">
            <input type="reset" value="Limpar">
        </form>
    </body>
</html>
